[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flarex"
version = "0.3.0"
description = "Interpretable analysis layer for archived NASA microgravity combustion imagery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0",
  "scikit-image>=0.21", "scikit-learn>=1.3",
  "opencv-python-headless>=4.8", "matplotlib>=3.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
